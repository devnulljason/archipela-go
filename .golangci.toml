version = "2"

[linters]
default = "standard"
enable = [
    "embeddedstructfieldcheck",
    "errname",
    "funcorder",
    "godoclint",
    "godot",
    "gosec",
    "misspell",
    "modernize",
    "nakedret",
]

[linters.exclusions]
presets = ["std-error-handling", "common-false-positives"]

[[linters.exclusions.rules]]
path = '(.+)_test\.go'
linters = ["godoclint"]

[linters.settings.funcorder]
alphabetical = true
function = true

[linters.settings.godoclint]
default = "all"
options = { max-len = { length = 97 } }

[linters.settings.misspell]
locale = "US"

[formatters]
enable = ["gofumpt"]
